[llm.main]
model = "deepseek-v4-flash"
api_key = "${DEEPSEEK_API_KEY}"
base_url = "https://api.deepseek.com/v1"
enable_thinking = false
# 模型真实上下文容量。memory_window 与 max_tokens 未显式配置时按它等比例派生。
context_window = 128000

[agent]
max_iterations = 40
system_prompt = "你是 Kirakira。使用与用户相同的语言回答；执行前核实，完成后给出可验证结果。"

# 可选：显式覆盖派生值。留空则由 context_window 决定。
# [agent.context]
# effective_context_percent = 0.9
# memory_window = 40
# 超限时会依次移除 skills catalog、recent context、长期记忆、检索记忆，最后缩短历史；
# 每次尝试的 section/token 明细会写进 session 消息的 context_trace。

[memory]
enabled = true
plugin = "default"

# Cloud worker 必填。PostgreSQL/pgvector 只做候选召回，最终排序仍走原 Memory 算法。
[memory.embedding]
model = "text-embedding-v3"
api_key = "${EMBEDDING_API_KEY}"
base_url = "https://embedding-provider.example.com/v1"
# 必须与 provider 返回维度一致；Cloud HNSW schema 固定为 1024 维。
output_dimensionality = 1024

# =============================================================================
# 主动推送（Proactive）与 Drift 空闲任务 —— 与被动回复并列的两条差异化链路
# =============================================================================
[proactive]
# 这里只配置全局算法参数。是否投递、投递到哪个 conversation 由 Cloud API
# 的 /v1/conversations/{id}/automation durable 配置控制，不是手动触发。
# base_score 高（长期沉默或近期语境丰富）用短间隔，否则用长间隔；单位秒。
tick_interval_s1 = 2400
tick_interval_s0 = 4800
tick_jitter = 0.3
max_tokens = 1024
# 留空则复用 [llm.main].model
model = ""

[proactive.agent]
# content 通道单轮最多评估的候选条数。
content_limit = 5
# 距上次推送不足该小时数时，抑制 content 刷屏（alert 不受限）。
delivery_cooldown_hours = 1
content_max_age_days = 14   # 未读 content 超过该龄期(天)淘汰,防止无界堆积

[proactive.drift]
# Drift 是否运行同样由 conversation automation 配置控制；这些是原算法参数。
min_interval_hours = 3
max_steps = 20
